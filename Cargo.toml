[package]
name = "stovbot"
version = "0.19.0"
authors = ["Steve Mostovoy <stevemostovoysm@gmail.com>"]
edition = "2021"
default-run = "stovbot"

[[bin]]
name = "stovbot"
path = "src/stovbot.rs"

[[bin]]
name = "script_engine"
path = "src/script_engine.rs"

[profile.dev]
opt-level = 0
lto = false
codegen-units = 8

[dependencies]
twitchchat = { version = "0.14", features = ["async", "tokio", "tokio-util"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }
rhai = "1"
logos = "0.14"
rand = "0.8"
rusqlite = { version = "0.32", features = ["chrono", "bundled"] }
toml = "0.8"
iced = "0.14"
crossbeam = "0.8"
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio02 = { package = "tokio", version = "0.2", features = ["full"] }
env_logger = "0.11"
rocket = "0.5"
clap = { version = "4", features = ["derive"] }
regex = "1"
base64 = "0.22"
